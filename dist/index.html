<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Civil Three.js Simple (Z-up)</title>
		<script type="module" crossorigin src="./assets/index-D2ED20f8.js"></script>
		<link rel="stylesheet" crossorigin href="./assets/index-DEDeVJk0.css">
	</head>
	<body>
		<button id="btn-settings" title="Roadway and daylight settings" style="left: 10px;">Settings</button>
		<div id="overlay" class="overlay hidden">
			<div class="overlay-header">
				<span>Cross-Section</span>
				<button class="overlay-close" aria-label="Close cross-section" title="Close">×</button>
			</div>
			<canvas id="overlay-canvas" width="320" height="200"></canvas>
		</div>
		<div id="profile-overlay" class="overlay hidden" style="top: 286px;">
			<div class="overlay-header">
				<span>Vertical Profile</span>
				<button class="overlay-close" aria-label="Close profile" title="Close">×</button>
			</div>
			<canvas id="profile-canvas" width="320" height="200"></canvas>
		</div>
		<div id="settings-overlay" class="overlay hidden" style="top: 52px; left: 380px; width: 360px; height: 260px;">
			<div class="overlay-header">
				<span>Roadway Settings</span>
				<button class="overlay-close" aria-label="Close settings" title="Close">×</button>
			</div>
			<div class="overlay-content">
				<form id="settings-form">
					<div class="field">
						<label for="laneWidth">Lane width (m, per side)</label>
						<input id="laneWidth" name="laneWidth" type="number" step="0.1" min="0" />
					</div>
					<div class="field">
						<label for="shoulderWidth">Shoulder width (m, per side)</label>
						<input id="shoulderWidth" name="shoulderWidth" type="number" step="0.1" min="0" />
					</div>
					<div class="field">
						<label for="crossfallLane">Crossfall lane (slope, e.g., -0.02)</label>
						<input id="crossfallLane" name="crossfallLane" type="number" step="0.005" />
					</div>
					<div class="field">
						<label for="crossfallShoulder">Crossfall shoulder (slope, e.g., -0.04)</label>
						<input id="crossfallShoulder" name="crossfallShoulder" type="number" step="0.005" />
					</div>
					<div class="field">
						<label for="daylightHtoV">Daylight slope H:V (e.g., 2 = 2H:1V)</label>
						<input id="daylightHtoV" name="daylightHtoV" type="number" step="0.1" min="0.1" />
					</div>
					<div class="actions">
						<button type="button" id="btn-settings-apply">Apply</button>
						<button type="button" id="btn-settings-reset">Reset</button>
					</div>
				</form>
			</div>
		</div>
		<div id="app"></div>
		<div id="volume-overlay" class="coords">Cut: — m³  Fill: — m³</div>
		<div id="coord-overlay" class="coords">E: —  N: —  Z: —</div>
		<!-- Left tools panel -->
		<div id="tools-panel" aria-label="Tools">
			<div id="create-tools" class="tool-section">
				<button id="btn-polyline" class="tool-btn" title="Create Polyline" aria-label="Create Polyline">
					<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
						<polyline points="3,18 10,6 16,12 21,5" fill="none" stroke="currentColor" stroke-width="2" />
						<circle cx="3" cy="18" r="2" fill="currentColor"></circle>
						<circle cx="10" cy="6" r="2" fill="currentColor"></circle>
						<circle cx="16" cy="12" r="2" fill="currentColor"></circle>
						<circle cx="21" cy="5" r="2" fill="currentColor"></circle>
					</svg>
				</button>
				<button id="btn-align" class="tool-btn" title="Create Alignment" aria-label="Create Alignment">
					<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
						<path d="M4 18 L9 6 L15 12 L20 5" fill="none" stroke="currentColor" stroke-width="2"></path>
						<rect x="3" y="17" width="2" height="2" fill="currentColor"></rect>
						<rect x="8" y="5" width="2" height="2" fill="currentColor"></rect>
						<rect x="14" y="11" width="2" height="2" fill="currentColor"></rect>
						<rect x="19" y="4" width="2" height="2" fill="currentColor"></rect>
					</svg>
				</button>
			</div>
			<button id="btn-template" class="tool-btn" title="Add Template" aria-label="Add Template">
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
					<rect x="5" y="6" width="14" height="10" rx="1" ry="1" fill="none" stroke="currentColor" stroke-width="2"></rect>
					<path d="M9 10h6v2H9z" fill="currentColor"></path>
				</svg>
			</button>
			<button id="btn-delete" class="tool-btn" title="Delete" aria-label="Delete">
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
					<path d="M3 6h18" stroke="currentColor" stroke-width="2" fill="none"></path>
					<path d="M8 6v-2h8v2" stroke="currentColor" stroke-width="2" fill="none"></path>
					<rect x="6" y="6" width="12" height="14" rx="1" ry="1" fill="none" stroke="currentColor" stroke-width="2"></rect>
					<path d="M10 10v6M14 10v6" stroke="currentColor" stroke-width="2"></path>
				</svg>
			</button>
			<button id="btn-calc-all" class="tool-btn" title="Calculate totals for all corridors" aria-label="Calculate All">
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
					<path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" fill="none"></path>
				</svg>
			</button>
			<div id="delete-menu" class="popup-menu hidden">
				<button id="btn-del-corridor">Delete selected corridor</button>
				<button id="btn-del-source">Delete its source polyline</button>
			</div>
		</div>
		<div id="section-panel" aria-label="Section Tools">
			<div id="section-tools" class="tool-section">
				<button id="btn-cross-section" class="tool-btn" title="Toggle cross-section overlay" aria-label="Cross-Section">
					<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
						<rect x="4" y="6" width="16" height="12" rx="1" ry="1" fill="none" stroke="currentColor" stroke-width="2"></rect>
						<path d="M4 12h16" stroke="currentColor" stroke-width="2" fill="none"></path>
					</svg>
				</button>
				<button id="btn-profile" class="tool-btn" title="Toggle profile overlay" aria-label="Profile">
					<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
						<path d="M4 18 L8 12 L12 14 L16 10 L20 11" fill="none" stroke="currentColor" stroke-width="2"></path>
					</svg>
				</button>
			</div>
		</div>

		<!-- Template Library Overlay -->
		<div id="template-overlay" class="overlay hidden" style="top: 52px; left: 380px; width: 280px; height: 250px;">
			<div class="overlay-header">
				<span>Template Library</span>
				<button class="overlay-close" aria-label="Close template library" title="Close">×</button>
			</div>
			<div class="overlay-content">
				<div id="template-list" class="template-list"></div>
				<div class="actions">
					<button type="button" id="btn-template-edit">Edit Template</button>
					<button type="button" id="btn-template-confirm">Confirm</button>
					<button type="button" id="btn-template-cancel">Cancel</button>
				</div>
			</div>
		</div>

		<!-- Trench Volume Overlay -->
		<div id="trench-volume-overlay" class="coords">Trench: — m³</div>

		<!-- Corridor right-click context menu -->
		<div id="corridor-ctx-menu" class="popup-menu hidden" style="left:0; top:0;">
			<button id="ctx-del-corridor">Delete corridor</button>
			<button id="ctx-change-template">Change template…</button>
		</div>

		<!-- Quick Corridor Info Overlay -->
		<div id="corridor-info-overlay" class="overlay hidden" style="top: 52px; left: 660px; width: 300px; height: 240px;">
			<div class="overlay-header">
				<span>Quick Corridor Info</span>
				<button class="overlay-close" aria-label="Close corridor info" title="Close">×</button>
			</div>
			<div class="overlay-content">
				<div id="corridor-info-name" style="font-size:12px; color:#c7cbd1;"></div>
				<div id="corridor-info-total" style="margin:6px 0 8px; font-size:12px;"></div>
				<div id="corridor-info-materials" class="mat-list"></div>
			</div>
		</div>

		<!-- All Corridors Totals Overlay -->
		<div id="totals-overlay" class="overlay hidden" style="top: 300px; left: 680px; width: 320px; height: 260px;">
			<div class="overlay-header">
				<span>All Corridors Total</span>
				<button class="overlay-close" aria-label="Close totals" title="Close">×</button>
			</div>
			<div class="overlay-content">
				<div id="totals-info" style="font-size:12px; color:#c7cbd1; margin-bottom:8px;"></div>
				<div id="totals-materials" class="mat-list" style="max-height:140px; overflow:auto;"></div>
				<div class="actions" style="margin-top:8px;">
					<button type="button" id="btn-export-totals-csv">Export CSV</button>
				</div>
			</div>
		</div>

		<!-- Template Editor Overlay -->
		<div id="template-editor-overlay" class="overlay hidden" style="top: 300px; left: 380px; width: 380px; height: 320px;">
			<div class="overlay-header">
				<span>Edit Template</span>
				<button class="overlay-close" aria-label="Close editor" title="Close">×</button>
			</div>
			<div class="overlay-content">
				<div class="field">
					<label for="tpl-name">Name</label>
					<input id="tpl-name" type="text" />
				</div>
				<div class="field">
					<label for="tpl-materials-json">Materials (JSON)</label>
					<textarea id="tpl-materials-json" rows="8" style="resize:vertical; background:#1f2329; color:#e6e6e6; border:1px solid #3a3f46; border-radius:6px; padding:6px 8px;"></textarea>
					<div style="font-size:11px; color:#9aa1ab;">Format: [{ name, color (hex), polygon: [{x,y}, ...] }, ...]</div>
				</div>
				<div class="actions">
					<button type="button" id="btn-tpl-save">Save</button>
					<button type="button" id="btn-tpl-cancel">Cancel</button>
				</div>
			</div>
		</div>
	</body>
</html>
